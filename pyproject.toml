[project]
name = "stock-winning-rate"
version = "0.1.0"
description = "Taiwan stock chip analysis and US tech market reports"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
stock = ["requests>=2.28.0", "pandas>=2.0.0"]
ui = ["fpdf2>=2.8.0"]
tech = [
    "requests>=2.28.0",
    "fpdf2>=2.8.0",
    "matplotlib>=3.8.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "requests>=2.28.0",
]
